<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <main class="tela-login">
    <div class="caixa-login painel">
      <h1>Finance Controller</h1>
      <p class="sub">Controle financeiro pessoal</p>

      <div class="tabs">
        <div class="abas">
          <label for="login">entrar</label>
          <label for="singin">cadastrar</label>
        </div>

        <input id="login" name="zzz" type="radio" class="trigger" checked>
        <form class="login">
          <input required type="email" name="email" placeholder="email">
          <input required type="password" name="password" placeholder="senha">
          <button>entrar</button>
        </form>

        <input id="singin" name="zzz" type="radio" class="trigger">
        <form class="signin">
          <input required type="text" name="nome" maxlength="80" placeholder="nome">
          <input required type="number" min="0" max="130" name="idade" placeholder="idade">
          <input required type="email" name="email" placeholder="email">
          <input required minlength="6" type="password" name="password" placeholder="senha (mín. 6)">
          <input required minlength="6" type="password" name="password-confirm" placeholder="confirmar senha">
          <button>cadastrar-se</button>
        </form>
      </div>
    </div>
  </main>

  <script>
    // Se já estiver logado, vai direto para o dashboard
    fetch("/auth/user").then(r => { if (r.ok) window.location.href = "/dashboard" })

    const frmLogin = document.querySelector("form.login")

    frmLogin.addEventListener("submit", async (event) => {
      event.preventDefault()
      const response = await fetch("/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          "email": frmLogin.email.value,
          "password": frmLogin.password.value,
        })
      })

      if (response.status == 404)
        return alert("Usuário não cadastrado")

      if (response.status == 401)
        return alert("Senha incorreta")

      if (response.ok) {
        window.location.href = "/dashboard"
        return
      }

      return alert("erro não tratado")
    })

    // ----------------------------------------------------------------------

    const frmSingin = document.querySelector("form.signin")

    frmSingin.addEventListener("submit", async (event) => {
      event.preventDefault()

      if (frmSingin.password.value !== frmSingin["password-confirm"].value)
        return alert("As senhas não conferem")

      const response = await fetch("/usuario", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          "nome": frmSingin.nome.value,
          "idade": parseInt(frmSingin.idade.value),
          "email": frmSingin.email.value,
          "password": frmSingin.password.value,
        })
      })

      if (response.status == 409)
        return alert("Este email já está cadastrado")

      if (response.ok) {
        frmLogin.email.value = frmSingin.email.value   // já deixa o email preenchido no login
        frmSingin.reset()
        document.querySelector("#login").checked = true
        return alert("Cadastro feito! Agora é só entrar.")
      }

      alert("Erro no cadastro: " + await response.text())
    })
  </script>

</body>

</html>
